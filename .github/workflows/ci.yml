name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  part-b-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: part_b/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts bench
      - run: ruff format --check src tests scripts bench
      - run: pytest -q

  part-b-docker:
    runs-on: ubuntu-latest
    needs: part-b-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: part_b
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
