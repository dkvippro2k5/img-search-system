services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tạo bucket private và upload index/thumbs từ ./data (chạy một lần).
  init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-imgsearch}
      INDEX_VERSION: ${INDEX_VERSION:-dev}
    volumes:
      - ../data:/data:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      (mc mirror --overwrite /data/index/v$$INDEX_VERSION local/$$S3_BUCKET/index/v$$INDEX_VERSION || true) &&
      (mc mirror --overwrite /data/thumbs local/$$S3_BUCKET/thumbs || true)
      "

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      INDEX_DIR: /cache/index
      MODELS_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - index-cache:/cache
      # text encoder ONNX cho dense (scripts/export_text_encoder.py); không có thì chỉ BM25
      - ../models:/models:ro
    depends_on:
      init:
        condition: service_completed_successfully
    # Giới hạn tài nguyên ghi vào báo cáo benchmark.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g

  # docker compose --profile bench run --rm bench
  bench:
    image: grafana/k6:0.54.0
    profiles: ["bench"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8000
    volumes:
      - ./bench:/bench
      - ./testsets:/testsets:ro
    command: run --summary-export=/bench/results/summary.json /bench/k6/search.js

volumes:
  minio-data:
  index-cache:
