services:
  # Image MinIO chính thức (minio/minio, minio/mc, quay.io/minio) không còn kéo công khai được
  # (đo 20/10/2026: "pull access denied"). Dùng bản Chainguard, ghim digest. Image không có
  # shell/curl nên không có healthcheck: init tự chờ MinIO nhận kết nối.
  minio:
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    user: "0:0"  # volume mới tạo thuộc root; user mặc định 65532 không ghi được
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Tạo bucket private và đẩy index/v{INDEX_VERSION}/ + thumbnail (nếu đã chạy
  # scripts/make_thumbs.py) lên MinIO (chạy một lần, bỏ qua file đã có). Dùng chính image của
  # api (boto3), không cần minio/mc.
  init:
    image: imgsearch:local
    build: .
    depends_on:
      - minio
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-imgsearch}
      INDEX_VERSION: ${INDEX_VERSION:-dev}
    volumes:
      - ../data/index:/data/index:ro
      - ../data/thumbs:/data/thumbs:ro
    command: python -m imgsearch.storage.s3 --src /data/index --thumbs /data/thumbs --wait 60
    healthcheck:
      disable: true  # job chạy một lần; HEALTHCHECK của image là của api

  api:
    image: imgsearch:local
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      INDEX_VERSION: ${INDEX_VERSION:-dev}
      # Tải index/v{INDEX_VERSION}/ từ MinIO (do init đẩy lên) về /cache lúc khởi động;
      # không có index thì /healthz 503, không chạy với index rỗng.
      INDEX_FROM_S3: "true"
      REQUIRE_INDEX: "true"
      INDEX_DIR: /cache/index
      # Ảnh có trong index/v{ver}/thumbs.txt: presigned URL tới MinIO, ký bằng địa chỉ trình
      # duyệt tới được; ảnh còn lại (hoặc chưa chạy make_thumbs.py) hotlink image_url.
      THUMBS_FROM_S3: "true"
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      MODELS_DIR: /models
      ONNX_THREADS: "4"  # = cpus bên dưới
      # numpy (OpenBLAS) mặc định mở luồng theo số lõi của máy (22), không theo giới hạn 4 CPU
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      QUERY_CACHE_SIZE: ${QUERY_CACHE_SIZE:-1024}
      # 2: thông lượng giữ ổn định khi tăng tải (reports/perf.md: 0 = sụp từ 34 xuống 17 QPS)
      SEARCH_CONCURRENCY: ${SEARCH_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    volumes:
      - index-cache:/cache
      # text encoder ONNX cho dense (scripts/export_text_encoder.py); không có thì chỉ BM25
      - ../models:/models:ro
    depends_on:
      init:
        condition: service_completed_successfully
    # Giới hạn tài nguyên ghi vào báo cáo benchmark.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g

  # docker compose --profile bench run --rm bench
  bench:
    image: grafana/k6:0.54.0
    profiles: ["bench"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8000
    volumes:
      - ./bench:/bench
      - ./testsets:/testsets:ro
    # raw.json: từng request (bench/make_report.py tính p50/p95/p99 theo mức VU, loại truy vấn)
    command: >
      run --summary-export=/bench/results/summary.json
      --out json=/bench/results/raw.json /bench/k6/search.js

volumes:
  minio-data:
  index-cache:
