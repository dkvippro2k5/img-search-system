[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgsearch"
version = "0.1.0"
description = "Capstone Phần B: truy xuất ảnh người nổi tiếng Việt Nam bằng ngôn ngữ tự nhiên"
readme = "README.md"
requires-python = ">=3.11"
# Phụ thuộc runtime của API: không kéo torch (suy luận bằng ONNX Runtime CPU).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "rapidfuzz>=3.9",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
# Dựng index, thumbnail, KG (chạy offline, không cần trong image API).
index = [
    "pandas>=2.2",
    "pyarrow>=16",
    "pillow>=10.3",
    "tqdm>=4.66",
    "requests>=2.32",
]
# Mã hóa ảnh và xuất text encoder sang ONNX (offline, bước 3). torch bản CPU:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
embed = [
    "torch>=2.4",
    "open_clip_torch>=2.30",
    "transformers>=4.45",
    "onnx>=1.16",
    "onnxscript>=0.1",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"imgsearch.data" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Danh sách từ vựng tiếng Việt viết dạng "a b c".split() dễ đọc hơn list literal.
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
