# Tham số truy xuất (Phần B).
retrieval:
  rrf_k: 60
  bm25_top_n: 200
  dense_top_n: 200
  person_boost: 1.5
  top_k_default: 30
multi_intent:
  co_occurrence_markers: ["cùng", "chung", "với nhau", "chụp cùng"]
  min_per_intent_top10: 2
llm_parser:
  enabled: false
  timeout_seconds: 1.5
  cache_size: 10000
safety:
  safe_search_default: true
